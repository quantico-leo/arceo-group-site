name: Replace header logo

on:
  push:
    paths:
      - '.github/workflows/replace-header-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace header logo asset
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          old = 'src="Logo.png"'
          new = 'src="avertum-logo-refined-master.png"'

          if new in html:
              print('New logo is already active.')
          elif old in html:
              html = html.replace(old, new, 1)
              path.write_text(html, encoding='utf-8')
              print('Header logo replaced successfully.')
          else:
              raise SystemExit('Expected Logo.png reference was not found.')

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use refined Avertum logo in header"
          git push
