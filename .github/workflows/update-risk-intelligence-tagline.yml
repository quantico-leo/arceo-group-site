name: Update risk intelligence tagline

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-risk-intelligence-tagline.yml'

permissions:
  contents: write

jobs:
  update-tagline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update Swedish and English taglines
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          replacements = {
              'KONTINUERLIG CYBERBEREDSKAP FÖR SMEs': 'KONTINUERLIG RISKINTELLIGENS FÖR SMÅ OCH MEDELSTORA FÖRETAG',
              'CONTINUOUS CYBER READINESS FOR SMEs': 'CONTINUOUS RISK INTELLIGENCE FOR SMEs',
          }

          changed = False
          for old, new in replacements.items():
              if old in html:
                  html = html.replace(old, new)
                  changed = True

          if not changed:
              raise SystemExit('No matching tagline text was found.')

          path.write_text(html, encoding='utf-8')
          print('Taglines updated successfully.')

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Position Avertum as a risk intelligence company"
          git push
