name: Update platform and intent copy

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-platform-and-intent-copy.yml'
      - 'scripts/update_platform_intent_copy.py'

permissions:
  contents: write

jobs:
  patch-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update platform and intent copy
        run: python scripts/update_platform_intent_copy.py

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine platform labels and Avertum intent copy"
          git push
