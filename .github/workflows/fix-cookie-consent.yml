name: Fix launch compliance

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-cookie-consent.yml'
      - 'scripts/patch_launch_compliance.py'

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch site
        run: python scripts/patch_launch_compliance.py

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Activate consent mode and link privacy policy"
          git push
