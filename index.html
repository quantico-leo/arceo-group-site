    .card {

/* SECTION BACKGROUNDS */
.section-bg {
  position: relative;
  isolation: isolate;
  overflow: hidden;
}

.section-bg::before {
  content: '';
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  z-index: -2;
}

.section-bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    180deg,
    rgba(5, 9, 20, 0.72) 0%,
    rgba(5, 9, 20, 0.90) 100%
  );
  z-index: -1;
}

.section-bg-platform::before {
  background-image: url('Data_Center.jpg');
}

.section-bg-mandates::before {
  background-image: url('Command%20center.png');
}
   
    /* Data Cards */
    .data-card {
  background: rgba(5, 9, 20, 0.88);

  border: 1px solid var(--border);

    let currentLang = 'sv';
    let previousFocus = null;

    const elModal = document.getElementById('privacyModal');
    const elMenu = document.getElementById('mobileMenu');
    const btnToggle = document.getElementById('menu-toggle');

    function updateActiveButtons(lang) {
      ['btn-sv', 'btn-en', 'btn-sv-mob', 'btn-en-mob'].forEach(id => {
        const btn = document.getElementById(id);
        if(!btn) return;
        btn.classList.remove('active');
        if(lang === 'en' && id.includes('en')) btn.classList.add('active');
        if(lang === 'sv' && id.includes('sv')) btn.classList.add('active');
      });
    }

    function setLang(lang) {
      currentLang = (lang === 'en') ? 'en' : 'sv';
      document.documentElement.setAttribute('lang', currentLang === 'en' ? 'en' : 'sv-SE');

      const dict = i18n[currentLang] || i18n.sv;

      document.querySelectorAll('[data-i18n], [data-i18n-html]').forEach(el => {
        const keyText = el.getAttribute('data-i18n');
        const keyHtml = el.getAttribute('data-i18n-html');
        
        if (keyText && dict[keyText]) {
          el.textContent = dict[keyText];
        } else if (keyHtml && dict[keyHtml]) {
          el.innerHTML = dict[keyHtml];
        }
      });

      const url = new URL(window.location.href);
      if(currentLang === 'en') url.searchParams.set('lang','en');
      else url.searchParams.delete('lang');
      window.history.replaceState({}, "", url);

      updateActiveButtons(currentLang);

      if(window.CookieConsent && typeof CookieConsent.setLanguage === 'function') {
        CookieConsent.setLanguage(currentLang);
      }
    }

    function toggleMenu() {
      const isActive = elMenu.classList.contains('active');
      elMenu.classList.toggle('active');
      elMenu.setAttribute('aria-hidden', isActive ? 'true' : 'false');
      btnToggle.setAttribute('aria-expanded', !isActive ? 'true' : 'false');
    }

    function openModal() {
      previousFocus = document.activeElement;
      elModal.classList.add('active');
      document.body.style.overflow = 'hidden';
      document.getElementById('modal-content').focus();
    }
    
    function closeModal() {
      elModal.classList.remove('active');
      document.body.style.overflow = '';
      if(previousFocus) previousFocus.focus();
    }

    document.addEventListener('DOMContentLoaded', () => {
      const y = document.getElementById('year');
      if(y) y.textContent = new Date().getFullYear();

      const params = new URLSearchParams(window.location.search);
      setLang(params.get('lang') === 'en' ? 'en' : 'sv');

      document.getElementById('btn-sv')?.addEventListener('click', () => setLang('sv'));
      document.getElementById('btn-en')?.addEventListener('click', () => setLang('en'));
      document.getElementById('btn-sv-mob')?.addEventListener('click', () => { setLang('sv'); toggleMenu(); });
      document.getElementById('btn-en-mob')?.addEventListener('click', () => { setLang('en'); toggleMenu(); });

      document.querySelectorAll('.mobile-link').forEach(link => {
          link.addEventListener('click', toggleMenu);
      });
      btnToggle?.addEventListener('click', toggleMenu);

      document.getElementById('btn-privacy')?.addEventListener('click', openModal);
      document.getElementById('btn-close-modal')?.addEventListener('click', closeModal);
      
      elModal?.addEventListener('click', (e) => {
        if(e.target === elModal) closeModal();
      });

      document.addEventListener('keydown', (e) => {
        if(e.key === 'Escape' && elModal.classList.contains('active')) closeModal();
      });

      document.querySelectorAll('img').forEach(img => {
          img.addEventListener('error', function() {
              this.classList.add('failed');
              this.setAttribute('alt', '');
          });
          if(img.complete && img.naturalHeight === 0) {
              img.classList.add('failed');
          }
      });
    });

  </script>
